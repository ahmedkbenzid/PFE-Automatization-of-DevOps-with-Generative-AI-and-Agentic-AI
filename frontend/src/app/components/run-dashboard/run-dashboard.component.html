<section class="mx-auto max-w-7xl px-4 py-6" *ngIf="runId$ | async as runId">
  <header class="mb-5 rounded-xl border border-devflow-border bg-devflow-surface p-4 shadow-lg">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-devflow-text-muted">Run Dashboard</p>
        <h1 class="text-xl font-bold text-devflow-text">Run <span class="font-mono text-devflow-accent">{{ runId }}</span></h1>
      </div>
      <div class="rounded-lg border border-devflow-border bg-devflow-elevated px-3 py-2 text-sm font-semibold text-devflow-text font-mono">
        ⏱️ Elapsed: {{ elapsedSeconds$ | async }}s
      </div>
    </div>
    <a routerLink="/" class="mt-3 inline-flex items-center gap-1 text-sm font-semibold text-devflow-accent hover:text-blue-400 transition-colors">
      ← Start another run
    </a>
  </header>

  <ng-container *ngIf="activeTab$ | async as activeTab">
    <div class="mb-4 flex gap-2 border-b border-devflow-border pb-2">
      <button
        (click)="setTab('logs')"
        [class.bg-devflow-elevated]="activeTab === 'logs'"
        [class.text-devflow-accent]="activeTab === 'logs'"
        class="rounded-lg px-4 py-2 text-sm font-semibold text-devflow-text-muted hover:bg-devflow-surface transition-colors"
      >
        Logs
      </button>
      <button
        (click)="setTab('workspace')"
        [class.bg-devflow-elevated]="activeTab === 'workspace'"
        [class.text-devflow-accent]="activeTab === 'workspace'"
        class="rounded-lg px-4 py-2 text-sm font-semibold text-devflow-text-muted hover:bg-devflow-surface transition-colors"
      >
        Workspace
      </button>
    </div>

    <div class="grid gap-4">
      <app-agent-status [result]="result$ | async"></app-agent-status>

      <div *ngIf="activeTab === 'logs'">
        <app-terminal-panel [lines]="(logs$ | async) ?? []"></app-terminal-panel>
      </div>

      <div *ngIf="activeTab === 'workspace'" class="grid gap-4">
        <app-approval-gate [result]="approvalResult$ | async" [runId]="runId"></app-approval-gate>

        <div *ngIf="actionOptionsInput$ | async as actionInput" class="rounded-xl border border-slate-200 bg-white p-4 shadow-md">
          <h2 class="mb-4 text-lg font-bold text-slate-800">🎯 Actions</h2>
          <app-action-options
            [input]="actionInput"
            (accepted)="onArtifactsAccepted($event)"
            (rejected)="onArtifactsRejected()"
          ></app-action-options>
        </div>

        <div class="mt-3">
          <a
            [routerLink]="['/cicd', runId]"
            class="inline-flex items-center gap-2 rounded-lg border border-devflow-border bg-devflow-elevated px-4 py-2.5 text-sm font-semibold text-devflow-accent shadow-sm transition-all duration-200 hover:border-devflow-accent hover:bg-devflow-surface hover:shadow-md active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
            Sandbox Execution
          </a>
        </div>

      </div>
    </div>
  </ng-container>
</section>
